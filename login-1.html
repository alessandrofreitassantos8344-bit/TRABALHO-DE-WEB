<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#eef1f8; --surface:#ffffff; --ink:#1b2340; --muted:#5d6785;
  --line:#cfd5e6; --accent:#3a4fd8; --accent-ink:#ffffff; --err:#b3261e; --ok:#16794c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10142a; --surface:#1a2040; --ink:#eef0fa; --muted:#a2abc9;
    --line:#38406a; --accent:#8c9bff; --accent-ink:#10142a; --err:#ff8a80; --ok:#6fdca5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10142a; --surface:#1a2040; --ink:#eef0fa; --muted:#a2abc9;
  --line:#38406a; --accent:#8c9bff; --accent-ink:#10142a; --err:#ff8a80; --ok:#6fdca5;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0; min-height:100%; display:grid; place-items:center; padding:24px 16px;
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5;
}
main{
  width:100%; max-width:400px; background:var(--surface);
  border:1px solid var(--line); border-radius:16px; padding:32px 28px;
}
h1{margin:0 0 4px; font-size:1.9rem; line-height:1.15; font-weight:700; letter-spacing:-.02em}
.sub{margin:0 0 24px; color:var(--muted)}
label{display:block; margin:0 0 6px; font-weight:500; font-size:.95rem}
.field{margin-bottom:18px}
.input{position:relative}
input[type=email],input[type=password],input[type=text]{
  width:100%; padding:12px 14px; font:inherit; color:var(--ink);
  background:transparent; border:1px solid var(--line); border-radius:10px;
}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
input[aria-invalid=true]{border-color:var(--err)}
.toggle{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:none; border:0; color:var(--muted); font:inherit; font-size:.9rem;
  padding:6px 10px; border-radius:8px; cursor:pointer;
}
.msg{margin:6px 0 0; font-size:.88rem; color:var(--err); min-height:0}
.row{display:flex; justify-content:space-between; align-items:center; gap:12px; margin:-2px 0 22px; font-size:.92rem}
.check{display:flex; align-items:center; gap:8px; margin:0; font-weight:400}
.check input{width:18px; height:18px; accent-color:var(--accent)}
a{color:var(--accent); text-decoration-thickness:1px; text-underline-offset:3px}
.btn{
  width:100%; padding:13px 16px; font:inherit; font-weight:700; cursor:pointer;
  background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px;
}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.65; cursor:progress}
.status{margin:16px 0 0; text-align:center; font-size:.92rem; min-height:1.4em}
.status.ok{color:var(--ok)} .status.bad{color:var(--err)}
.foot{margin:22px 0 0; text-align:center; color:var(--muted); font-size:.92rem}
</style>
</head>
<body>
<main>
  <h1>Entrar na sua conta</h1>
  <p class="sub">Use seu e-mail e senha para continuar.</p>

  <form id="form" novalidate>
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
      <p class="msg" id="email-msg" role="alert"></p>
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <div class="input">
        <input id="senha" name="senha" type="password" autocomplete="current-password" minlength="6" required style="padding-right:84px">
        <button type="button" class="toggle" id="toggle" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
      </div>
      <p class="msg" id="senha-msg" role="alert"></p>
    </div>

    <div class="row">
      <label class="check"><input type="checkbox" name="lembrar"> Manter conectado</label>
      <a href="#recuperar">Esqueci a senha</a>
    </div>

    <button class="btn" id="submit" type="submit">Entrar</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>

  <p class="foot">Ainda não tem conta? <a href="#cadastro">Criar conta</a></p>
</main>

<script>
(function(){
  var form=document.getElementById('form'),
      email=document.getElementById('email'),
      senha=document.getElementById('senha'),
      toggle=document.getElementById('toggle'),
      btn=document.getElementById('submit'),
      status=document.getElementById('status');

  toggle.addEventListener('click',function(){
    var show=senha.type==='password';
    senha.type=show?'text':'password';
    toggle.textContent=show?'Ocultar':'Mostrar';
    toggle.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');
    toggle.setAttribute('aria-pressed',String(show));
  });

  function setErr(input,id,text){
    document.getElementById(id).textContent=text;
    input.setAttribute('aria-invalid',text?'true':'false');
    return !text;
  }

  function validate(){
    var okE=setErr(email,'email-msg',
      !email.value.trim()?'Digite seu e-mail.':
      !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)?'Digite um e-mail válido, como voce@exemplo.com.':'');
    var okS=setErr(senha,'senha-msg',
      !senha.value?'Digite sua senha.':
      senha.value.length<6?'A senha precisa ter pelo menos 6 caracteres.':'');
    return okE&&okS;
  }

  form.addEventListener('submit',function(e){
    e.preventDefault();
    status.className='status'; status.textContent='';
    if(!validate()){ (email.getAttribute('aria-invalid')==='true'?email:senha).focus(); return; }
    btn.disabled=true; btn.textContent='Entrando…';
    // Troque este trecho pela chamada ao seu servidor (fetch/POST).
    setTimeout(function(){
      btn.disabled=false; btn.textContent='Entrar';
      status.className='status ok';
      status.textContent='Login validado. Conecte o formulário ao seu servidor.';
    },900);
  });
})();
</script>
</body>
</html>
